name: Build
on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Nix provides the ESP32-C6 / RP2350 toolchains + Arduino cores (see
      # MODULE.bazel / nix/). `bazel build` realizes them on first use, so the
      # x86_64-linux runner exercises the x86_64 toolchain fetch — the leg that
      # host (aarch64 / darwin) dev never hits. Single-user install so the whole
      # /nix store is cacheable by cache-nix-action below.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      # Cache the realized /nix store (fetched toolchains + arduino cores +
      # anything built from source) across runs. Keyed on the nix/toolchain
      # inputs; restores the most recent matching cache on a key miss and only
      # rebuilds the delta. GC keeps it under the GHA 10 GB cache budget.
      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Build one firmware image per board family so the riscv (ESP32-C6) and
      # arm (RP2350) cross toolchains are both realized and compile/link cleanly.
      - name: Build firmware images
        run: |
          bazel build -c opt \
            //apps/blink:esp32c6 //apps/rainbow:esp32c6 //apps/wifi_ap:esp32c6 \
            //apps/blink:rp2350 //apps/rainbow:rp2350

      # --build_tests_only: run the host tests without also (re)building every
      # board's firmware binary. Tolerate exit 4 (no test targets matched) so the
      # workflow stays green if the host-test set is ever empty under CI's platform.
      - name: Test
        run: |
          bazel test //... --build_tests_only --test_output=errors \
            || { rc=$?; [ "$rc" -eq 4 ] && echo "::notice::no test targets matched" || exit "$rc"; }
