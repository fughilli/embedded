<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32-C6 LED</title>
<style>
  :root { --led: #000000; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(120vmax 120vmax at 50% 120%,
        color-mix(in srgb, var(--led) 45%, #101418), #101418);
    transition: background 0.3s ease;
    color: #e8eaed;
    padding: 1.5rem;
  }
  main {
    width: min(22rem, 100%);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 1.25rem;
    padding: 2rem;
    text-align: center;
    backdrop-filter: blur(12px);
  }
  h1 { font-size: 1.3rem; font-weight: 600; }
  p { margin-top: 0.4rem; font-size: 0.9rem; color: #9aa0a6; }
  .swatch {
    margin: 1.5rem auto 0.75rem;
    width: 9rem;
    height: 9rem;
    position: relative;
  }
  input[type="color"] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    height: 100%;
    border: 3px solid rgba(255, 255, 255, 0.25);
    border-radius: 50%;
    background: none;
    padding: 0;
    cursor: pointer;
    box-shadow: 0 0 3rem 0.25rem color-mix(in srgb, var(--led) 55%, transparent);
    transition: box-shadow 0.3s ease;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
  input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }
  #hex {
    font: 600 1rem ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em;
    color: #e8eaed;
  }
</style>
</head>
<body>
<main>
  <h1>ESP32-C6 LED</h1>
  <p>Tap the circle to set the onboard LED color</p>
  <div class="swatch"><input type="color" id="picker" value="#000000"></div>
  <div id="hex">#000000</div>
</main>
<script>
  const picker = document.getElementById('picker');
  const hex = document.getElementById('hex');
  let inflight = false, pending = null;
  async function send(c) {
    if (inflight) { pending = c; return; }
    inflight = true;
    try { await fetch('/led?c=' + c.slice(1)); } catch (e) {}
    inflight = false;
    if (pending !== null) { const p = pending; pending = null; send(p); }
  }
  picker.addEventListener('input', () => {
    const c = picker.value;
    document.documentElement.style.setProperty('--led', c);
    hex.textContent = c;
    send(c);
  });
</script>
</body>
</html>
